name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Screenshots/**"
      - "Authenticator/Assets.xcassets/AppIcon.appiconset/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The icon already lives in the repo for the app and the readme, so copy it
      # in rather than keeping a duplicate under site/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp Authenticator/Assets.xcassets/AppIcon.appiconset/icon_512x512.png _site/icon.png
          cp Screenshots/app.png _site/screenshot.png
          cp Screenshots/add-account.png _site/add-account.png
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
