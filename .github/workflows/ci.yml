name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # No Developer ID certificate on CI, so fall back to ad-hoc signing.
      # App Sandbox and the entitlements still apply.
      - name: Test
        run: |
          xcodebuild test \
            -project Authenticator.xcodeproj \
            -scheme Authenticator \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""
